[project]
name = "cfpb-complaints-platform"
version = "0.1.0"
description = "Banking Complaints Data Platform - 020IABDM2 Big Data Frameworks (USJ/ESIB)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
