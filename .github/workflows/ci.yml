name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Spark 3.5 needs Java 17 (same as docker/spark/Dockerfile); newer runner defaults fail.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: python -m pytest -q

      - name: Validate docker-compose file
        run: |
          if [ -f docker-compose.yml ]; then
            cp .env.example .env
            docker compose config --quiet
            echo "docker-compose.yml is valid"
          else
            echo "No docker-compose.yml yet - skipping"
          fi

  mongodb:
    # Turn 4: real MongoDB 7 (same image as docker-compose). Runs the serving-layer integration
    # tests and the end-to-end sample: raw -> Spark -> curated -> MongoDB, loaded twice to prove
    # that a replay does not inflate counts.
    name: mongodb-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0@sha256:9896df581dfd0718b7abe112f4c37598d0986c54060e4ec1384997e6503c8c71
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: cfpb_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: MongoDB integration and end-to-end tests
        run: python -m pytest -v tests/integration/test_mongo_serving.py tests/e2e
