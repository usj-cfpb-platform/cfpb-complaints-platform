name: Incremental collection

# Collects recent CFPB complaints every 12 hours (decision D-002) and keeps the raw pages as a
# workflow artifact. The runner has no MinIO, so it writes to a local folder with the SAME key
# layout; `python -m ingestion.sync_artifacts` later uploads those runs into MinIO unchanged.
#
# The runner is stateless (--no-state): the window is [today - lookback_days, today]. The wide
# lookback means a skipped or delayed run loses no data; duplicates are removed by Spark.
# It fails fast until domain.products is assigned in config/settings.yaml (never runs unfiltered).
on:
  schedule:
    - cron: "17 3,15 * * *"   # off the top of the hour; keep equal to incremental.schedule_cron_utc
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Override lookback window in days (blank = settings.yaml)"
        required: false
        default: ""
      max_pages:
        description: "Stop after N pages, run becomes 'partial' (blank = no extra limit)"
        required: false
        default: ""

concurrency:
  group: incremental-collection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Install collector dependencies
        run: python -m pip install -r requirements-collector.txt

      - name: Collect raw API pages
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=(--sink local --out collected --no-state --trigger "$TRIGGER")
          if [ -n "$LOOKBACK_DAYS" ]; then args+=(--lookback-days "$LOOKBACK_DAYS"); fi
          if [ -n "$MAX_PAGES" ]; then args+=(--max-pages "$MAX_PAGES"); fi
          python -m ingestion.incremental "${args[@]}"

      - name: Keep raw pages and run metadata as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: collected/
          retention-days: 30
          if-no-files-found: warn
